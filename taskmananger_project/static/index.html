<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>🧠 Smart Task Manager</h1>

    <div class="input-row">
        <input id="taskInput" placeholder="What needs to be done?">
        <button onclick="addTask()">Add</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="taskTable"></tbody>
    </table>
</div>

<script src="/static/app.js"></script>
</body>
</html>
